name: Feature request
description: Suggest something Blackgrid should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Only the first box is required.

        Blackgrid only reads game logs and your screen, and never touches the game. Ideas that would need it to read game memory, send input or control the game can't be accepted.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Optional. How you'd like it to work, if you have an idea.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Workarounds you use now, or other approaches you thought about.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Your best guess is fine.
      options:
        - Map and location
        - Extracts and transits
        - Scanner (keep or sell advice)
        - Item search
        - Settings
        - Installer and updates
        - Other
