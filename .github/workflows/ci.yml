name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Analyze, test, build and qualify
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore vision inputs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .dart_tool/blackgrid_vision_inputs
          key: vision-inputs-${{ hashFiles('windows/vision/third_party.lock.json') }}

      - name: Install tools from mise.toml
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5

      - name: Analyze
        run: mise run analyze

      - name: Test
        run: mise run test

      - name: Build Release
        run: mise run build:release

      - name: Save vision inputs
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .dart_tool/blackgrid_vision_inputs
          key: vision-inputs-${{ hashFiles('windows/vision/third_party.lock.json') }}

      - name: Qualification
        shell: pwsh
        env:
          BLACKGRID_NO_GAMES_RUNNING: "1"
          BLACKGRID_RELEASE_BUNDLE: ${{ github.workspace }}\build\windows\x64\runner\Release
          BLACKGRID_PANEL_OCR_RUNTIME: ${{ github.workspace }}\build\windows\x64\runner\Release
        run: |
          $env:BLACKGRID_CMAKE = (Get-Command cmake).Source
          mise run ci:qualification
