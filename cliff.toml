# git-cliff 2.14.2: https://git-cliff.org/docs/configuration/
[changelog]
header = """
# blackgrid Changelog
{% if releases | length == 0 %}
## Unreleased
{% endif %}
"""
header_marker = ""
body = """
{% if version %}
## {{ version }}{% if timestamp %} - {{ timestamp | date(format="%Y-%m-%d") }}{% endif %}
{% else %}
## Unreleased
{% endif %}
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group }}
{% for commit in entry.commits %}
- {% if commit.breaking %}**BREAKING** {% endif %}{% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message }}{% if commit.breaking_description and commit.breaking_description != commit.message %} — {{ commit.breaking_description }}{% endif %}
{% endfor %}
{% endfor %}
"""
trim = true
render_always = true
format = true

[git]
conventional_commits = true
filter_unconventional = false
# GitHub merge commits become one entry per PR: the merge message is rewritten
# to "<PR title> (#<number>)" before conventional parsing. Branch commits are
# removed by tool/changelog.dart (first-parent filter), not here.
commit_preprocessors = [
    { pattern = '(?s)\AMerge pull request #(\d+) from \S+\n\n([^\n]+).*', replace = "${2} (#${1})" },
]
# Skips come before the group parsers. Match the parsed conventional type, not
# a non-conventional message prefix.
commit_parsers = [
    # Release commits and their merges (the merge is rewritten to the PR title).
    { message = '^chore\(release\): v', skip = true },
    # Branch-only subjects, as a guard for the same commits made directly on main.
    { message = '^\w+(\([^)]*\))?: (task \d|amend (specs|design|tasks)|address review feedback|add planning artifacts|archive change)', skip = true },
    { field = "group", pattern = "^feat$", group = "Features" },
    { field = "group", pattern = "^fix$", group = "Fixes" },
    { field = "group", pattern = "^perf$", group = "Performance" },
    { field = "group", pattern = "^docs$", group = "Documentation" },
    { field = "group", pattern = "^(refactor|style)$", group = "Refactoring" },
    { field = "group", pattern = "^test$", group = "Testing" },
    { field = "group", pattern = "^(build|ci|chore)$", group = "Build, CI, and tooling" },
    { message = ".*", group = "Other" },
]
# Strict v-prefixed SemVer 2.0.0. Numeric prerelease identifiers cannot
# have leading zeroes; build metadata may, as allowed by https://semver.org/.
tag_pattern = '\Av(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?\z'
# Prerelease tags get no section of their own: the next final release lists
# everything since the last final release.
ignore_tags = '\Av[0-9]+\.[0-9]+\.[0-9]+-'
sort_commits = "oldest"
