[tools]
flutter = "3.47.6"
"aqua:orhun/git-cliff" = "2.14.2"

[tasks.analyze]
description = "Run Flutter static analysis"
run = "flutter analyze"

[tasks.test]
description = "Run fast development tests"
run = "flutter test --exclude-tags qualification"

[tasks."test:qualification"]
description = "Run expensive offline qualification tests"
run = "flutter test --tags qualification"

[tasks."test:all"]
description = "Run the complete test suite"
run = "flutter test"

[tasks.format]
description = "Format Dart source"
run = "dart format ."

[tasks."format:check"]
description = "Check Dart formatting without changing files"
run = "dart format --output=none --set-exit-if-changed ."

[tasks.changelog]
description = "Regenerate CHANGELOG.md from local Git history"
run = "dart run tool/changelog.dart --output CHANGELOG.md"

[tasks.release-notes]
description = "Print release notes; forward git-cliff tag/range options after --"
run = "dart run tool/changelog.dart --strip header"

[tasks."qualification:freeze"]
description = "Collect explicit reference metadata; forward collector parameters after --"
run = "pwsh -NoProfile -File tool/qualification/freeze_reference.ps1"

[tasks."qualification:validate"]
description = "Validate versioned M0 evidence; forward record path and options after --"
run = "dart run tool/qualification/m0.dart validate"

[tasks."qualification:report"]
description = "Generate M0 qualification report from recorded evidence"
run = "dart run tool/qualification/m0.dart report"
