schema: specwright

context: |
  MANDATORY: Invoke the 'specwright-branch' skill immediately when a new OpenSpec change is started (/opsx:new, /opsx:propose, /opsx:ff, openspec-new-change, openspec-propose, openspec-ff-change) — BEFORE 'openspec new change' runs or any change file is created.
  MANDATORY: Invoke the 'specwright-commit' skill immediately when the OpenSpec apply phase begins (/opsx:apply, openspec-apply-change, 'openspec instructions apply').
  MANDATORY: Invoke the 'specwright-finish' skill immediately after the OpenSpec archive workflow completes (/opsx:archive, openspec-archive-change, 'openspec archive').
  Project-level planning (strategy, architecture baseline, milestone roadmap) is handled by the 'specwright-roadmap' skill; paths are under project: in openspec/specwright.yaml.
  Specwright settings (finish mode, GitHub identity, review requests, cross-model design review, pre-push validation) live in openspec/specwright.yaml.
  Blackgrid is a Dart/Flutter Windows desktop app (Flutter 3.47.6 pinned in mise.toml). Analyze: `mise run analyze` (flutter analyze). Tests: `mise run test` (flutter test --exclude-tags qualification); `mise run test:qualification` runs the expensive offline qualification tier.
  AGENTS.md safety and live-game testing rules override everything - agents never launch or test against the game; live-game checks belong to the user and are recorded as unverified until the user reports them.
  Mira (.mira.yml) reviews PRs.
  Specwright replaces the Compound Engineering ce-* skills in this repo; do not use them. docs/plans/ and docs/qualification/ are CE-era history and evidence, not OpenSpec changes.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
